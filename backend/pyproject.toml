[project]
name = "codementor-backend"
version = "0.1.0"
description = "CodeMentor backend: reveal-boundary-guarded AI tutoring for LeetCode-style problems."
requires-python = ">=3.11"
dependencies = [
    # Pinned so a fresh `pip install -e .` reproduces the tested environment
    # exactly. PyroCore itself pins the same fastapi/starlette/uvicorn set, so a
    # single interpreter can host both services without a version fight.
    "fastapi==0.139.0",
    "starlette==1.3.1",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "email-validator==2.3.0",
    "httpx==0.28.1",
    "PyYAML==6.0.2",
    # Fernet encryption for user-supplied AI keys (BYOK).
    "cryptography==46.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.1",
    "mypy==1.19.1",
]
# Provider SDKs are optional: the gateway talks plain HTTP, so a deployment that
# only uses one provider does not need every client's transitive dependencies.
openai = ["openai==2.15.0"]
anthropic = ["anthropic==0.75.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
ignore = [
    "S101",  # assert: used deliberately in tests and invariant checks
    "B008",  # FastAPI Depends() in defaults is the framework's idiom
    "RUF001", # Ambiguous unicode: our own UI strings legitimately use it
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"scripts/*" = ["S608"]
# SQL text is assembled deliberately: every value goes through the strict literal
# encoder in app/repositories/sql.py and every identifier through the whitelist
# guard. Concatenation is the design, not a defect, so S608 is silenced per module
# rather than at ~30 call sites. The encoder itself is unit-tested in
# tests/test_sql_encoding.py — that test, not this lint rule, is the control.
"app/repositories/*.py" = ["S608"]
"app/migrations/*.py" = ["S608"]
"app/services/*.py" = ["S608"]
"app/cache/*.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true