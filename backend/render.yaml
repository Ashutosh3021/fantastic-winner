# Render blueprint for the CodeMentor API.
#
#   render blueprint launch   (or push and connect in the dashboard)
#
# Secrets are not set here on purpose: a blueprint that carries a key would put
# it in git. Set these in the dashboard, or with `render secret set`:
#
#   render secret set PYRONITES_KEY=pyro_live_...
#   render secret set AI_ANTHROPIC_KEY=sk-ant-...
#
# Run migrations as a separate step rather than at boot on a web service:
#   render exec codementor-api python scripts/migrate.py
# then set PYRONITES_AUTO_MIGRATE=false so two instances cannot race.

services:
  - type: web
    name: codementor-api
    runtime: docker
    # Relative to the REPOSITORY ROOT, not to this file's directory. The
    # repository is the LG root and this service lives in backend/, so leaving
    # this as ./Dockerfile makes Render fail with "Dockerfile not found".
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYRONITES_URL
        sync: false
      - key: PYRONITES_PROJECT
        sync: false
      # Required. Without this the service boots and then fails every query with
      # 401 from Pyronites. Blueprint sync prompts for it because it is declared
      # here; it is never committed.
      - key: PYRONITES_KEY
        sync: false
      # Fernet key for stored BYOK credentials. Optional for boot, but the
      # /account/ai-key routes fail closed (503) when it is absent.
      - key: BYOK_ENCRYPTION_KEY
        sync: false
      - key: PYRONITES_AUTO_MIGRATE
        value: "false"
      - key: PYRONITES_TIMEOUT_S
        value: "30"
      # One proxy in front of the service, so a spoofed X-Forwarded-For cannot
      # walk around the per-IP AI budget.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOW_OFFLINE_PROVIDER
        value: "false"
      - key: AUTH_AUTO_VERIFY_DEV
        value: "false"
      - key: REQUIRE_VERIFIED_EMAIL_FOR_AI
        value: "true"
      # Comma separated. The extension origin is chrome-extension://<id>.
      # Baked in rather than left as a manual value: it is public (Chrome derives
      # it from the signing key) and an unset value silently rejects every
      # sign-in instead of failing loudly.
      - key: EXTENSION_RETURN_ORIGINS
        value: "chrome-extension://pmkgnbafanjpmmhphckgglhnpajpepal,chrome-extension://ncbohgigmifjgekpfeebkognlogpflfa"
      - key: ALLOWED_ORIGINS
        value: "chrome-extension://pmkgnbafanjpmmhphckgglhnpajpepal,chrome-extension://ncbohgigmifjgekpfeebkognlogpflfa"
      - key: AI_ANTHROPIC_KEY
        sync: false
      - key: AI_OPENAI_KEY
        sync: false
      - key: AI_GEMINI_KEY
        sync: false