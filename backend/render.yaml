# Render blueprint for the CodeMentor API.
#
#   render blueprint launch   (or push and connect in the dashboard)
#
# Secrets are not set here on purpose: a blueprint that carries a key would put
# it in git. Set these in the dashboard, or with `render secret set`:
#
#   render secret set PYRONITES_KEY=pyro_live_...
#   render secret set AI_ANTHROPIC_KEY=sk-ant-...
#
# Migrations are ledgered, so a boot can apply only what is missing. Running
# them at boot is deliberate: a deploy that serves against an older schema
# surfaces as an opaque datastore 400 in the one route that touches the new
# column, and a manual `render exec` step had already been skipped once.
# If the service ever scales past one instance, run migrations as a release
# command and set PYRONITES_AUTO_MIGRATE=false again.

services:
  - type: web
    name: codementor-api
    runtime: docker
    # Relative to the REPOSITORY ROOT, not to this file's directory. The
    # repository is the LG root and this service lives in backend/, so leaving
    # this as ./Dockerfile makes Render fail with "Dockerfile not found".
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYRONITES_URL
        sync: false
      - key: PYRONITES_PROJECT
        sync: false
      # Required. Without this the service boots and then fails every query with
      # 401 from Pyronites. Blueprint sync prompts for it because it is declared
      # here; it is never committed.
      - key: PYRONITES_KEY
        sync: false
      # Fernet key for stored BYOK credentials. When blank the service derives
      # one from PYRONITES_KEY; set it explicitly if that secret is ever rotated,
      # since rotation makes previously saved credentials unreadable.
      - key: BYOK_ENCRYPTION_KEY
        sync: false
      - key: PYRONITES_AUTO_MIGRATE
        value: "true"
      - key: PYRONITES_TIMEOUT_S
        value: "30"
      # One proxy in front of the service, so a spoofed X-Forwarded-For cannot
      # walk around the per-IP AI budget.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOW_OFFLINE_PROVIDER
        value: "false"
      - key: AUTH_AUTO_VERIFY_DEV
        value: "false"
      # GitHub OAuth app. Register this callback on the app:
      #   https://<service host>/v1/auth/extension/github/callback
      # Sign-in is disabled until both are set.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Optional fixed callback. Blank derives it from the request base URL.
      - key: GITHUB_OAUTH_REDIRECT_URL
        sync: false
      # Optional HMAC key for the OAuth state; falls back to the client secret.
      - key: AUTH_STATE_SECRET
        sync: false
      - key: REQUIRE_VERIFIED_EMAIL_FOR_AI
        value: "true"
      # Comma separated. The extension origin is chrome-extension://<id>.
      # Baked in rather than left as a manual value: it is public (Chrome derives
      # it from the signing key) and an unset value silently rejects every
      # sign-in instead of failing loudly.
      - key: EXTENSION_RETURN_ORIGINS
        value: "chrome-extension://pmkgnbafanjpmmhphckgglhnpajpepal,chrome-extension://ncbohgigmifjgekpfeebkognlogpflfa"
      - key: ALLOWED_ORIGINS
        value: "chrome-extension://pmkgnbafanjpmmhphckgglhnpajpepal,chrome-extension://ncbohgigmifjgekpfeebkognlogpflfa"
      - key: AI_ANTHROPIC_KEY
        sync: false
      - key: AI_OPENAI_KEY
        sync: false
      - key: AI_GEMINI_KEY
        sync: false
      - key: AI_GROQ_KEY
        sync: false